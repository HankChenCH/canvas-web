name: CI

on:
    push:
        branches: [main]
    pull_request:

jobs:
    ci:
        runs-on: ubuntu-latest
        steps:
            # 语料仓 submodule（扫描语料权威，fixture runner 直接读 corpus/）；
            # 凭据只覆盖 HTTPS，故 .gitmodules 用 https URL
            - uses: actions/checkout@v4
              with:
                  submodules: true

            # pnpm 版本读根 package.json 的 packageManager 字段（pnpm@10 固定）
            - uses: pnpm/action-setup@v4

            # Node 版本读 .nvmrc（22 = Node 22 LTS）
            - uses: actions/setup-node@v4
              with:
                  node-version-file: .nvmrc
                  cache: pnpm

            # Go 供支持面声明三互检用（canvasctl 随语料 submodule pin 消费，
            # 工具版本 = 语料版本；版本读 submodule 的 go.mod）
            - uses: actions/setup-go@v5
              with:
                  go-version-file: canvas-semantics/go.mod

            # 支持面声明三互检（SUPPORT-SURFACE §5.2）：校验本仓声明形状/注册表/版本
            # 与 pin 的语料一致
            - name: 支持面声明三互检
              working-directory: canvas-semantics
              run: go run ./canvasctl validate --surface ../support-surface.json .

            - name: 安装依赖
              run: pnpm install --frozen-lockfile

            # 红线自验要先于（或独立于）其余闸门：故意违规必须被抓
            - name: 依赖红线自验
              run: pnpm check:guardrails

            - name: 依赖红线校验
              run: pnpm depcruise

            - name: 各包类型检查
              run: pnpm -r typecheck

            - name: 各包测试
              run: pnpm -r test

            - name: 各包构建（发布产物管线）
              run: pnpm -r build
